<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vibe · Professional Music Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="/style.css" />
</head>
<body>
    <div class="music-app" id="app">
        <!-- HEADER -->
        <div class="app-header">
            <h1><i class="fas fa-compact-disc"></i> Vibe</h1>
            <div class="header-actions">
                <button id="shuffleBtn" title="Shuffle"><i class="fas fa-random"></i></button>
                <button id="repeatBtn" title="Repeat"><i class="fas fa-redo-alt"></i></button>
                <button id="uploadBtn" title="Upload"><i class="fas fa-upload"></i></button>
            </div>
        </div>

        <!-- COVER -->
        <div class="cover-wrapper">
            <img id="coverImage" src="/api/placeholder/400/400" alt="cover" />
        </div>

        <!-- TRACK INFO -->
        <div class="track-info">
            <h2 id="trackTitle">Midnight Glow</h2>
            <div class="artist"><i class="fas fa-user-circle"></i> <span id="trackArtist">Luna Echo</span></div>
        </div>

        <!-- PROGRESS -->
        <div class="progress-area">
            <span id="currentTime">0:00</span>
            <div class="progress-bar" id="progressBar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <span id="totalTime">0:00</span>
        </div>

        <!-- CONTROLS -->
        <div class="controls">
            <button id="prevBtn" aria-label="Previous"><i class="fas fa-step-backward"></i></button>
            <button class="play-btn" id="playBtn" aria-label="Play / Pause"><i class="fas fa-play" id="playIcon"></i></button>
            <button id="nextBtn" aria-label="Next"><i class="fas fa-step-forward"></i></button>
        </div>

        <!-- EXTRA CONTROLS -->
        <div class="extra-controls">
            <div class="volume-wrap">
                <i class="fas fa-volume-up"></i>
                <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.01" value="0.8" />
            </div>
            <div>
                <button class="like-btn" id="likeBtn"><i class="far fa-heart"></i></button>
                <span id="likeCount" style="font-size:0.7rem; color:#8aa6dd;">0</span>
            </div>
        </div>

        <!-- PLAYLIST -->
        <div class="playlist-section" id="playlistContainer"></div>
        
        <!-- UPLOAD MODAL -->
        <div id="uploadModal" class="modal">
            <div class="modal-content">
                <span class="close" id="closeModal">&times;</span>
                <h2>Upload New Track</h2>
                <form id="uploadForm" enctype="multipart/form-data">
                    <div class="form-group">
                        <label>Title</label>
                        <input type="text" name="title" placeholder="Track title" required />
                    </div>
                    <div class="form-group">
                        <label>Artist</label>
                        <input type="text" name="artist" placeholder="Artist name" />
                    </div>
                    <div class="form-group">
                        <label>Audio File (MP3)</label>
                        <input type="file" name="audio" accept=".mp3,.wav,.ogg" required />
                    </div>
                    <button type="submit" class="upload-submit">Upload Track</button>
                </form>
            </div>
        </div>

        <div class="footer-note"><i class="fas fa-music"></i> <span id="trackCount">6</span> tracks · click to play · drag volume</div>
    </div>

    <script src="/app.js"></script>
</body>
</html>
